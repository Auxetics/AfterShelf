<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AfterShelf</title>
  <link rel="icon" type="image/png" href="../assets/aftershelf-32.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="brand-logo" src="../assets/aftershelf-64.png" alt=""><div>AfterShelf<small>YOUR GAMES, KEPT CURRENT.</small></div></div>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Main navigation">
      <button data-nav="library" class="nav-item active"><span data-icon="library"></span>Library<span class="nav-count" id="library-count">0</span></button>
      <button data-nav="browse" class="nav-item"><span data-icon="globe"></span>Browse<span class="nav-dot"></span></button>
      <button data-nav="downloads" class="nav-item"><span data-icon="download"></span>Downloads<span class="nav-count" id="downloads-count">0</span></button>
      <button data-nav="activity" class="nav-item"><span data-icon="activity"></span>Activity</button>
    </nav>
    <div class="sidebar-bottom">
      <button data-nav="settings" class="nav-item"><span data-icon="settings"></span>Settings</button>
      <div class="build-label"><span class="status-dot"></span> LOCAL ALPHA <span id="app-version">0.1.0</span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-current">Library</strong></div>
      <div class="topbar-right"><button type="button" id="app-update-btn" class="app-update-chip" data-app-update-chip data-action="apply-app-update" hidden></button><div class="source-indicators" role="group" aria-label="Website status"><button type="button" class="site-chip" data-source-indicator="f95" data-action="open-source" data-source="f95" data-status="unchecked" aria-label="Open F95zone"><span class="status-dot" aria-hidden="true"></span><span class="site-label">F95</span></button><button type="button" class="site-chip" data-source-indicator="lc" data-action="open-source" data-source="lc" data-status="unchecked" aria-label="Open LewdCorner"><span class="status-dot" aria-hidden="true"></span><span class="site-label">LC</span></button></div><span class="alpha-label">ALPHA</span><button class="avatar" data-action="settings" aria-label="Open settings"><img src="../assets/aftershelf-32.png" alt=""></button></div>
    </header>
    <main id="content"></main>
    <footer class="statusbar"><button id="scan-status" data-action="check-updates"><span data-icon="refresh"></span><span>Not checked yet</span></button><span id="folder-status">Choose a games folder to get started</span><span id="platform-status">Desktop</span></footer>
  </div>
  <dialog id="modal"><form id="modal-form" method="dialog"><div id="modal-content"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./renderer.mjs"></script>
</body>
</html>
