name: Build AfterShelf

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: Upload missing packages to the matching alpha release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source syntax
        run: npm run check
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw new Error("Tag must match package.json version")'
      - name: Build application packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload architecture packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AfterShelf-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.7z
            release/**/*.blockmap

  prerelease:
    name: Publish tagged alpha
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_alpha)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: AfterShelf-*
          merge-multiple: true
          path: release
      - name: Publish prerelease packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          git diff --quiet "$RELEASE_TAG" HEAD -- app package.json package-lock.json scripts || {
            echo 'Application sources differ from this version tag. Bump the version and publish a new tag.'
            exit 1
          }
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "AfterShelf $RELEASE_TAG" --notes "Experimental alpha for Windows x64, macOS Apple Silicon and macOS Intel. General engine save-transfer profiles are experimental; report compatibility issues with redacted text diagnostics. Windows Web Setup downloads its separate application payload from this release. Mac DMGs contain the app and an Applications shortcut. Packages are not notarized or publisher-signed; application self-updating is not implemented."
          fi
          mapfile -t existing < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            found=false
            for previous in "${existing[@]}"; do
              if [[ "$name" == "$previous" ]]; then found=true; break; fi
            done
            if [[ "$found" == false ]]; then
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done < <(find release -type f -print0)
