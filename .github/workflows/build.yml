name: Build AfterShelf

on:
  push:
    branches: [main]
    tags: ['0.*-Alpha', 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: Upload packages to the matching draft alpha release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15
            platform: mac
            arch: x64
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source syntax
        run: npm run check
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const v=require("./package.json").version.replace(/^(\d+\.\d+)\.0(-Alpha.*)$/i,"$1$2"); if(process.env.GITHUB_REF_NAME!==v) throw new Error("Tag must match "+v)'
      - name: Build application packages
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          RELEASE_TAG="$(node -p 'require("./package.json").version.replace(/^(\d+\.\d+)\.0(-Alpha.*)$/i, "$1$2")')"
          npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never \
            -c.artifactName="AfterShelf-${RELEASE_TAG}-\${os}-\${arch}.\${ext}" \
            -c.nsisWeb.artifactName="AfterShelf-Web-Setup-${RELEASE_TAG}-\${os}-\${arch}.\${ext}" \
            -c.nsisWeb.appPackageUrl="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/aftershelf-${PKG_VERSION}-${{ matrix.arch }}.nsis.7z"
      - name: Build macOS web setup bootstrap
        if: matrix.platform == 'mac'
        run: node scripts/build-mac-installer.mjs --arch ${{ matrix.arch }}
      - name: Upload architecture packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AfterShelf-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            release/*.pkg
            release/*.dmg
            release/*.zip
            release/*.sha256
            release/*.exe
            release/*.7z
            release/*.blockmap
            release/nsis-web/*.exe
            release/nsis-web/*.7z
            release/nsis-web/*.blockmap
            !release/nsis-web/*__uninstaller.exe

  prerelease:
    name: Stage draft alpha release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_alpha)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: AfterShelf-*
          merge-multiple: true
          path: release
      - name: Upload draft release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(node -p 'require("./package.json").version.replace(/^(\d+\.\d+)\.0(-Alpha.*)$/i, "$1$2")')"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$RELEASE_TAG" --notes "It's the initial release."
          fi
          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          done < <(find release -type f -print0)
